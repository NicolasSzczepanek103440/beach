<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strand</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

</head>
<body>
    <a-scene>
        <!-- light -->
        <a-entity light="type: ambient; intensity: 1">

        </a-entity>

        <!-- prepare 3D assets -->
        <a-assets>
            <a-asset-item id="bottle" src="./assets/models/bottle.glb" ></a-asset-item>
        </a-assets>

        <!-- camera -->
        <a-entity rotation="0 90 0">
            <a-entity camera wasd-controls look-controls position="0 1.6 0">
                <a-sphere src="assets/models/Textures/beach_ball.jpeg" width="10" height="10" depth="10" position="2 -1.5 -4" rotation="0 -140 0"></a-sphere>
                <a-entity cursor="rayOrigin: mouse;" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" material="color: black; shader: flat"></a-entity>
            </a-entity>
        </a-entity>

        <!-- environment (sky, etc) -->
        <a-sky color="#a4c6fc" rotation="0 -135 0"></a-sky>

        <a-plane width="100" height="100" rotation="-90 0 0" color="yellow" shadow="receive: true;" src="assets/models/Textures/sand.jpg" position="0 -10 0"></a-plane>
        <a-plane width="100" height="100" rotation="-90 0 0" position="-100 -10 0" color="blue"></a-plane>
    
        <a-box width="6" height="6" depth="6" color="white" position="-30 -3 0" material="src: assets/models/Textures/schelp.jpg" animation="property: rotation; to: 360 360 0; easing: linear; loop: true; dur: 4000;" sound="src: url(audio/troll.mp3); on: click; volume: 30">
        </a-box>

        <!-- implementation 3d models -->

        <a-entity position="-10 -2 0" >

            <a-entity light="type: point; intensity: 1.3; castShadow: true; color: green" position="0 3 0" rotation="-180 0 0"></a-entity>

            <a-entity
                animation__float="property: position; loop: true; from: 0 -2 0; to: 0 -3 0; dir: alternate; dur: 1000; easing: easeInOutSine"
                gltf-model="#bottle"
                scale="3 3 3"

                geometry="primitive: box"
                material="color: #c2a878"
                shadow="cast: true; receive: true"

                animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 2000; loop: true; easing: linear;">
            </a-entity>
       
        </a-entity>
        
        
        
        
    </a-scene>
</body>
</html>
